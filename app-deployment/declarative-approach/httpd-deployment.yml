apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-cli
  label:
    app: cli-approach
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd-cli
  template:
    metadata:
      labels:
        app: httpd-cli
    spec:
      containers:
      - name: httpd-cli
        image: httpd:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "200m"
        ports:
        - containerPort: 80
